name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The TypeScript pack's tools (tsc, biome, bun test) run on Bun, at package.json's pin.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # mshape from node_modules: the npm package at shape.toml's pin (the sync check holds
      # them equal), so a TypeScript repo's CI downloads no release to run it.
      - run: bun run --silent mshape gate
