name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # uv runs the gate's ruff, ty and pytest at the versions uv.lock pins.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      # mshape at shape.toml's pin ([mshape] version; the latest release when unpinned), verified
      # by install.sh against the release's SHA256SUMS. Inside the repo, it runs the pinned version.
      - name: Install mshape
        run: |
          version=$(awk '/^\[/ { t = ($0 == "[mshape]") } t && /^version *=/ { gsub(/^version *= *"|".*$/, ""); print; exit }' shape.toml)
          curl -fsSL https://github.com/clinsky/monkeyshape/releases/latest/download/install.sh | MSHAPE_VERSION="$version" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mshape gate
