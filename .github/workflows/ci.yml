name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The fresh-agent test runs the real SessionStart hooks, bd's among them: a pinned bd,
      # its archive checked against GitHub's sha256 before it runs.
      - name: Install bd
        env:
          BD_VERSION: 1.3.1
          BD_SHA256: 3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bd.tgz" \
            "https://github.com/gastownhall/beads/releases/download/v$BD_VERSION/beads_${BD_VERSION}_linux_amd64.tar.gz"
          echo "$BD_SHA256  $RUNNER_TEMP/bd.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bd" && tar xzf "$RUNNER_TEMP/bd.tgz" -C "$RUNNER_TEMP/bd"
          install -D "$(find "$RUNNER_TEMP/bd" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bd" version
      # The Python pack's toolchain tests run uv, ruff, ty and pytest for real; with CI set, they
      # fail rather than skip when uv is missing. The cache holds the pinned wheels between runs.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "template/packs/python/uv.lock"
      # The Rust pack's toolchain tests run cargo, clippy and rustfmt, which the runner image
      # ships: fail here, by name, if an image ever drops one, rather than in the tests.
      - name: cargo, clippy and rustfmt are on the PATH
        run: cargo --version && cargo clippy --version && cargo fmt --version
      - run: bun install --frozen-lockfile
      - run: bun run --silent mshape gate

  # The compiled mshape: built once, then each run where there is no Bun, on its own machine.
  binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run release pack "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ${{ runner.temp }}/release/mshape-*
            ${{ runner.temp }}/release/install.sh
            ${{ runner.temp }}/release/SHA256SUMS

  binary-run:
    needs: binary
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Verify against SHA256SUMS and run with no Bun
        run: |
          if command -v sha256sum >/dev/null; then sha256sum --check SHA256SUMS; else shasum -a 256 --check SHA256SUMS; fi
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) bin=mshape-linux-x64 ;;
            Linux-ARM64) bin=mshape-linux-arm64 ;;
            macOS-ARM64) bin=mshape-darwin-arm64 ;;
            *) echo "no binary for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          chmod +x "$bin"
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin sh -c '! command -v bun'
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin "./$bin" --version
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin "./$bin" --help
      # install.sh as `curl | sh` runs it, from these assets laid out as a release (file://),
      # with only the system's tools: shasum on macOS, sha256sum on Linux.
      - name: Install with install.sh, with no Bun
        run: |
          mkdir -p "$RUNNER_TEMP/rel/download/v0.0.0"
          cp mshape-* install.sh SHA256SUMS "$RUNNER_TEMP/rel/download/v0.0.0/"
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin \
            MSHAPE_RELEASES_URL="file://$RUNNER_TEMP/rel" MSHAPE_VERSION=0.0.0 \
            MSHAPE_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          test -x "$RUNNER_TEMP/bin/mshape" && test -s "$RUNNER_TEMP/bin/mshape.sums"
          env -i HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/bin:/usr/bin:/bin" mshape --version
