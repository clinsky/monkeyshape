name: pr

# A track's PR body has every required section (PR_SECTIONS in monkeyshape's conventions.ts),
# however it was opened. Other branches' PRs skip this job.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  body:
    if: startsWith(github.head_ref, 'track/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: The PR body has every required section
        env:
          # Through the environment, never interpolated into the script: the body is untrusted.
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | bun run --silent mshape track pr --check-body
